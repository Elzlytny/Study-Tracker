<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes - Study Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/main.css" />
  <link rel="stylesheet" href="CSS/notes.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar__logo">StudyTracker</div>
    <ul class="navbar__links">
      <li><a href="index.html" class="navbar__link">Home</a></li>
      <li><a href="materials.html" class="navbar__link">Materials</a></li>
      <li><a href="tracker.html" class="navbar__link">Tracker</a></li>
      <li><a href="dashboard.html" class="navbar__link">Dashboard</a></li>
      <li><a href="tasks.html" class="navbar__link">Tasks</a></li>
      <li><a href="notes.html" class="navbar__link navbar__link--active">Notes</a></li>
      <li><a href="pomodoro.html" class="navbar__link">🍅 Pomodoro</a></li>
    </ul>
    <div class="navbar__actions">
      <button id="theme-toggle-btn" class="navbar__theme-btn" title="Toggle theme">🌙</button>
    </div>
  </nav>

  <div class="page-wrapper">

    <section id="notes-view" class="page-section">
      <div class="page-section__container">

        <h1 class="page-section__title">Notebook</h1>

        <form id="note-form" class="form-section">
          <div class="form-group">
            <label for="note-text" class="form-group__label">Note Content</label>
            <textarea id="note-text" class="form-group__input form-group__input--textarea" placeholder="Write your note..."></textarea>
          </div>

          <div class="form-group">
            <label for="note-subject" class="form-group__label">Link Note to Subject (Optional)</label>
            <input type="text" id="note-subject" class="form-group__input" placeholder="Subject name" />
          </div>

          <div class="form-section__actions">
            <button type="submit" id="note-submit-btn" class="btn btn--primary">Add Note</button>
            <button type="button" id="note-cancel-btn" class="btn btn--secondary" style="display:none;">Cancel Edit</button>
          </div>
        </form>

        <div id="notes-list-container" class="items-container"></div>

      </div>
    </section>

  </div>

  <footer class="footer">
    <p class="footer__text">Study Tracker &copy; 2026</p>
  </footer>

  <script src="JS/modules/main.js"></script>
  <script src="JS/modules/notes.js"></script>

</body>
</html>
