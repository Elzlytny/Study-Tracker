<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracker - Study Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/main.css" />
  <link rel="stylesheet" href="CSS/tracker.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar__logo">StudyTracker</div>
    <ul class="navbar__links">
      <li><a href="index.html" class="navbar__link">Home</a></li>
      <li><a href="materials.html" class="navbar__link">Materials</a></li>
      <li><a href="tracker.html" class="navbar__link navbar__link--active">Tracker</a></li>
      <li><a href="dashboard.html" class="navbar__link">Dashboard</a></li>
      <li><a href="tasks.html" class="navbar__link">Tasks</a></li>
      <li><a href="notes.html" class="navbar__link">Notes</a></li>
      <li><a href="pomodoro.html" class="navbar__link">🍅 Pomodoro</a></li>
    </ul>
    <div class="navbar__actions">
      <button id="theme-toggle-btn" class="navbar__theme-btn" title="Toggle theme">🌙</button>
    </div>
  </nav>

  <div class="page-wrapper">

    <section id="tracker-view" class="page-section">
      <div class="page-section__container">

        <h1 class="page-section__title">Score Tracker</h1>

        <form id="tracker-form" class="form-section">
          <div class="form-group">
            <label for="tracker-subject" class="form-group__label">Subject</label>
            <select id="tracker-subject" class="form-group__input form-group__input--select">
              <option value="">Select Subject</option>
            </select>
          </div>

          <div class="form-group">
            <label for="tracker-type" class="form-group__label">Type</label>
            <select id="tracker-type" class="form-group__input form-group__input--select">
              <option value="quiz">Quiz</option>
              <option value="sheet">Sheet</option>
            </select>
          </div>

          <div class="form-group">
            <label for="tracker-score" class="form-group__label">Score</label>
            <input type="number" id="tracker-score" class="form-group__input" placeholder="0" min="0" />
          </div>

          <div class="form-group">
            <label for="tracker-total" class="form-group__label">Total</label>
            <input type="number" id="tracker-total" class="form-group__input" max="20" min="0" />
          </div>

          <div class="form-group">
            <label for="tracker-lecture" class="form-group__label">Lecture No.</label>
            <input type="number" id="tracker-lecture" class="form-group__input" placeholder="1" min="1" />
          </div>

          <div class="form-group">
            <label for="tracker-date" class="form-group__label">Date</label>
            <input type="date" id="tracker-date" class="form-group__input" />
          </div>

          <div class="form-section__actions">
            <button type="submit" class="btn btn--primary">Add Entry</button>
            <button type="button" id="export-csv-btn" class="btn btn--secondary">Export CSV</button>
          </div>
        </form>

        <div id="tracker-list-container" class="items-container"></div>

      </div>
    </section>

  </div>

  <footer class="footer">
    <p class="footer__text">Study Tracker &copy; 2026</p>
  </footer>

  <script src="JS/modules/main.js"></script>
  <script src="JS/modules/tracker.js"></script>

</body>
</html>
